<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex OTC - Live Signal Dashboard</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #141a29;
            --accent-blue: #0084ff;
            --quotex-green: #00c853;
            --quotex-red: #ff3d00;
            --text-main: #f0f2f5;
            --border-color: #232d42;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
            color: var(--accent-blue);
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .clock-box {
            background: #0d121d;
            border: 1px solid #1e283d;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer-title { font-size: 12px; color: #8a94a6; }
        .live-time { font-size: 16px; font-weight: bold; color: #fff; }
        .next-candle-timer { font-size: 18px; font-weight: bold; color: #ffc107; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
        }

        .upload-zone {
            border: 2px dashed var(--accent-blue);
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(0, 132, 255, 0.05);
        }

        #previewCanvas {
            width: 100%;
            max-height: 160px;
            object-fit: contain;
            margin-top: 10px;
            border-radius: 6px;
            display: none;
            background: #000;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .signal-box {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
            border: 2px solid transparent;
        }

        .sig-ready { background: #1a2332; color: #8a94a6; border-color: #2b384e; }
        .sig-call { background: rgba(0, 200, 83, 0.15); color: var(--quotex-green); border-color: var(--quotex-green); }
        .sig-put { background: rgba(255, 61, 0, 0.15); color: var(--quotex-red); border-color: var(--quotex-red); }
        .sig-wait { background: rgba(255, 193, 7, 0.15); color: #ffc107; border-color: #ffc107; }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1c2536;
            font-size: 13px;
        }

        .target-time-badge {
            background: #0084ff;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h2>QUOTEX OTC LIVE SIGNAL ENGINE</h2>
        <div class="clock-box">
            <div>
                <div class="timer-title">Quotex Live Time</div>
                <div id="liveClock" class="live-time">00:00:00</div>
            </div>
            <div>
                <div class="timer-title">Candle Close In</div>
                <div id="candleTimer" class="next-candle-timer">00s</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>১. কোটেক্স স্ক্রিনশট অ্যানালিসিস</h3>
        <div class="upload-zone" onclick="document.getElementById('chartInput').click()">
            <span id="uploadText">Quotex OTC ক্যান্ডেলস্টিক স্ক্রিনশট আপলোড করুন</span>
            <input type="file" id="chartInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
        </div>
        <canvas id="previewCanvas"></canvas>
        <button id="analyzeBtn" class="btn-action" onclick="analyzeQuotexOTC()">এখনই সিগন্যাল জেনারেট করুন</button>
    </div>

    <div class="card">
        <h3>২. প্রেডিকশন আউটপুট</h3>
        <div id="signalBadge" class="signal-box sig-ready">READY FOR ANALYSIS</div>

        <div class="info-row">
            <span>এন্ট্রি ক্যান্ডেল টাইমিং:</span>
            <span id="entryTime" class="target-time-badge">--:--:00</span>
        </div>
        <div class="info-row">
            <span>কনফিডেন্স রেশিও:</span>
            <strong id="confidenceVal">0%</strong>
        </div>
        <div class="info-row">
            <span>বায়ার ডমিনেন্স:</span>
            <span id="buyerVal">0%</span>
        </div>
        <div class="info-row">
            <span>সেলার ডমিনেন্স:</span>
            <span id="sellerVal">0%</span>
        </div>
    </div>
</div>

<script>
    let uploadedImage = null;
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Live Quotex Clock & Timer Engine
    function updateClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');

        document.getElementById('liveClock').innerText = `${hrs}:${mins}:${secs}`;

        const remainingSeconds = 60 - now.getSeconds();
        document.getElementById('candleTimer').innerText = `${remainingSeconds}s`;

        // Next candle start time calculation (e.g., HH:MM:00)
        let nextMin = now.getMinutes() + 1;
        let nextHr = now.getHours();
        if (nextMin === 60) { nextMin = 0; nextHr = (nextHr + 1) % 24; }
        
        const nextTimeStr = `${String(nextHr).padStart(2,'0')}:${String(nextMin).padStart(2,'0')}:00`;
        document.getElementById('entryTime').innerText = nextTimeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                uploadedImage = img;
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                canvas.style.display = 'block';
                document.getElementById('uploadText').innerText = "অন্য স্ক্রিনশট সিলেক্ট করতে ট্যাপ করুন";
            }
            img.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }

    function analyzeQuotexOTC() {
        if (!uploadedImage) {
            alert('কোটেক্সের ক্যান্ডেলস্টিক স্ক্রিনশট সিলেক্ট করুন!');
            return;
        }

        const width = canvas.width;
        const height = canvas.height;
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;

        // Scan the recent 40% area of the chart
        let zoneStart = Math.floor(width * 0.60);
        let greenPower = 0;
        let redPower = 0;

        for (let x = zoneStart; x < width; x++) {
            let recentFactor = 1.0 + ((x - zoneStart) / (width - zoneStart)) * 2.0;

            for (let y = 0; y < height; y++) {
                let idx = (y * width + x) * 4;
                let r = data[idx];
                let g = data[idx + 1];
                let b = data[idx + 2];

                if (g > r + 15 && g > b + 15) {
                    greenPower += recentFactor;
                } else if (r > g + 15 && r > b + 15) {
                    redPower += recentFactor;
                }
            }
        }

        let totalPower = greenPower + redPower;
        if (totalPower === 0) {
            alert("ক্যান্ডেল কালার পাওয়া যায়নি। ছবি পরিষ্কার করে আপলোড দিন।");
            return;
        }

        let buyerPercent = (greenPower / totalPower) * 100;
        let sellerPercent = (redPower / totalPower) * 100;
        let diff = Math.abs(buyerPercent - sellerPercent);

        const badge = document.getElementById('signalBadge');
        badge.className = "signal-box";

        if (diff < 5.0) {
            badge.innerText = "WAIT / AVOID";
            badge.classList.add("sig-wait");
            document.getElementById('confidenceVal').innerText = "50% (High Risk)";
        } else if (buyerPercent > sellerPercent) {
            badge.innerText = "CALL (BUY UP)";
            badge.classList.add("sig-call");
            document.getElementById('confidenceVal').innerText = Math.min(88, Math.round(75 + diff * 0.4)) + "%";
        } else {
            badge.innerText = "PUT (SELL DOWN)";
            badge.classList.add("sig-put");
            document.getElementById('confidenceVal').innerText = Math.min(88, Math.round(75 + diff * 0.4)) + "%";
        }

        document.getElementById('buyerVal').innerText = buyerPercent.toFixed(1) + "%";
        document.getElementById('sellerVal').innerText = sellerPercent.toFixed(1) + "%";
    }
</script>
</body>
</html>
